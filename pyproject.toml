[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrascout"
version = "0.1.0"
description = "A compact autonomy demo for a crop-inspection rover in GPS-degraded orchards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kazmir Fahrier" }]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
terrascout-demo = "terrascout.runner.mission:main"
terrascout-render = "terrascout.viz.render:main"
terrascout-reproduce = "terrascout.runner.reproduce:main"

[tool.setuptools.packages.find]
include = ["terrascout*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the original CI rule set explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Use the active interpreter so installed dependency stubs match its syntax.
strict = true
packages = ["terrascout"]

[tool.pytest.ini_options]
addopts = "--cov=terrascout --cov-report=term-missing --cov-fail-under=80 -m 'not performance'"
markers = ["performance: elapsed time checks that must run without coverage instrumentation"]
